packages:
  - "apps/*"
  - "packages/*"

# Build-script approvals (pnpm blocks dependency install scripts by default).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true
  # Transitive dev/test dep pulled in via shadcn; not used at runtime.
  msw: false
  # esbuild downloads its platform binary; required by tsx (realtime dev/runtime).
  esbuild: true
  # Prisma CLI schema/migration engine binaries.
  '@prisma/engines': true
  prisma: true
  # Transitive of posthog-js — postinstall only prints a funding banner.
  core-js: false
  # Transitive of @sentry/node — ships prebuilt; no codegen needed at install.
  protobufjs: false
